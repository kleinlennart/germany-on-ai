# --- EU ------------------------------------------------------------------------

- id: eu-council-votes
  name: Council of the EU voting results
  publisher: Council of the European Union
  url: https://www.consilium.europa.eu/en/documents/public-register/votes/
  description: Member states' votes, abstentions and annexed statements on Council acts.
  kind: primary
  arenas: [eu]
  access: scrape
  status: planned
  languages: [en]
  terms:
    notes: >-
      Site refuses automated fetches; check the Council's legal notice by hand. The EU-wide legal
      notice (CC BY 4.0) does not say whether it covers Council documents.

- id: howtheyvote
  name: HowTheyVote.eu
  publisher: HowTheyVote.eu
  url: https://howtheyvote.eu
  description: European Parliament roll-call votes by member, including German members.
  kind: tracker
  arenas: [eu]
  access: dataset
  status: referenced
  reason: >-
    ODbL share-alike does not fit this dataset's CC BY 4.0 licence; credited as a resource, and
    European Parliament data is used instead.
  languages: [en]
  terms:
    licence: ODbL 1.0 (database); DbCL 1.0 (contents)
    url: https://howtheyvote.eu/data#license
    verified: 2026-11-17
    notes: Share-alike; derived databases must stay under ODbL. Attribution required. Photos and vote summaries fall under the European Parliament legal notice.

- id: eeas-un-ny
  name: EU Delegation to the UN, New York
  publisher: European External Action Service
  url: https://www.eeas.europa.eu/delegations/un-new-york
  description: EU statements at the UN that Germany aligns with.
  kind: primary
  arenas: [eu, international]
  access: scrape
  status: planned
  languages: [en]
  terms:
    licence: Reuse authorised with acknowledgement (Commission Decision 2011/833/EU)
    url: https://www.eeas.europa.eu/eeas/legal-notice_en
    verified: 2026-11-17
  raw_publishable: true

- id: european-parliament-open-data
  name: European Parliament open data
  publisher: European Parliament
  url: https://data.europarl.europa.eu
  description: >-
    The Parliament's open data portal; intended source for roll-call votes by member, including
    German members. Coverage and format still to be confirmed.
  kind: primary
  arenas: [eu]
  access: api
  status: planned
  languages: [en]
  terms:
    licence: Reuse authorised with acknowledgement (© European Union – Source European Parliament)
    url: https://www.europarl.europa.eu/legal-notice/en/
    notes: >-
      From the europarl.europa.eu legal notice; whether it governs the open data portal is not yet
      confirmed (portal is client-rendered).

