# Source catalogue: every source the project ingests or points to.
# Schema: src/germany_on_ai/schema/source.py. Check with `uv run germany-on-ai catalogue`.

# --- Parliament -------------------------------------------------------------

- id: dip
  name: DIP (Documentation and Information System for Parliamentary Materials)
  name_original: Dokumentations- und Informationssystem für Parlamentsmaterialien
  publisher: Deutscher Bundestag
  url: https://dip.bundestag.de
  description: Proceedings, printed papers, plenary transcripts and persons for the Bundestag and Bundesrat, with full text.
  kind: primary
  arenas: [domestic]
  access: api
  status: planned
  languages: [de]
  update_frequency: daily
  terms:
    url: https://dip.bundestag.de/%C3%BCber-dip/nutzungsbedingungen
    notes: >-
      Per the Bundestag Impressum, printed papers and plenary transcripts are official works without
      copyright (§ 5 UrhG), subject to the change prohibition (§ 62) and source attribution (§ 63).
      DIP's own terms page is client-rendered and not yet read; check by hand.
  docs:
    - https://dip.bundestag.de/%C3%BCber-dip/hilfe/api
    - https://search.dip.bundestag.de/api/v1/openapi.yaml
    - https://www.bundestag.de/impressum

- id: bundestag-hearings
  name: Bundestag committee hearings
  publisher: Deutscher Bundestag
  url: https://www.bundestag.de
  description: Committee hearing pages with invited experts and their written statements.
  kind: primary
  arenas: [domestic]
  access: scrape
  status: planned
  languages: [de]
  terms:
    licence: No open licence; private use only
    url: https://www.bundestag.de/impressum
    verified: 2026-11-17
    notes: Experts' written statements are third-party works; short excerpts and links only.
  raw_publishable: false

- id: open-discourse
  name: Open Discourse
  publisher: Open Discourse
  url: https://opendiscourse.de
  description: Every Bundestag plenary speech since 1949 with speaker metadata, as a research dataset.
  kind: tracker
  arenas: [domestic]
  access: dataset
  status: referenced
  reason: DIP covers the period in scope; kept as a reference for historical speeches.
  languages: [de]
  terms:
    notes: >-
      Site releases data for use and reuse and asks for citation (Richter et al. 2020,
      doi:10.7910/DVN/FIKIBO). Code is MIT; data licence not found (Dataverse record unreadable).
      Project is no longer under active development.

# --- Lobbying and members ---------------------------------------------------

- id: lobbyregister
  name: Lobby Register
  name_original: Lobbyregister
  publisher: Deutscher Bundestag
