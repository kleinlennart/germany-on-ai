    url: https://www.lobbyregister.bundestag.de/informationen-und-hilfe/open-data-1049716
    notes: >-
      Open-data page and FAQ name no licence. The site uses the Bundestag Impressum, whose general
      rule allows private use only, but it does not say whether that covers register data.
      Clarify with the Bundestag before publishing raw register data.
