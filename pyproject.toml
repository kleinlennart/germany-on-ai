[project]
name = "germany-on-ai"
version = "0.1"
description = "An open, sourced record of Germany's engagement on AI."
readme = "README.md"
authors = [
    { name = "kleinlennart", email = "31488915+kleinlennart@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
germany-on-ai = "germany_on_ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "pandas>=3.1.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.105",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
extend-exclude = [".agents", ".claude"]
# pre-commit passes files by name; keep the excludes for those too (vendored skills).
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# German source text uses typographic dashes and quotes; passages must stay verbatim.
ignore = ["RUF001", "RUF003"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
